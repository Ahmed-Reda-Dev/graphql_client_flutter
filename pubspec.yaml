name: graphql_client_flutter
description: >-
  The simple, typed GraphQL client for Flutter: one-line setup, normalized
  cache, widgets, auth refresh, subscriptions, offline store and a testing kit.
version: 2.5.0
homepage: https://github.com/Ahmed-Reda-Dev/graphql_client_flutter
repository: https://github.com/Ahmed-Reda-Dev/graphql_client_flutter
issue_tracker: https://github.com/Ahmed-Reda-Dev/graphql_client_flutter/issues
documentation: https://pub.dev/documentation/graphql_client_flutter/latest/

topics:
  - graphql
  - api
  - network
  - cache
  - websocket

screenshots:
  - description: Example app in light mode, with a live data badge.
    path: doc/images/app-light.webp
  - description: Example app in dark mode.
    path: doc/images/app-dark.webp
  - description: One mutation updates every query that shows the same object.
    path: doc/images/normalized-cache.webp
  - description: Expired tokens are refreshed once for all pending requests.
    path: doc/images/auth-refresh.webp
  - description: DevTools extension with live operations and the cache.
    path: doc/images/devtools.webp
  - description: Architecture overview.
    path: doc/images/architecture.webp

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  dio: ^5.10.0
  flutter:
    sdk: flutter
  gql: ^1.0.1
  meta: ^1.19.0
  normalize: ^0.10.0
  path: ^1.9.0
  path_provider: ^2.1.5
  source_span: ^1.10.2
  web: ^1.1.2
  web_socket_channel: ^3.0.1
  yaml: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
license: MIT
